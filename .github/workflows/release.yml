name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (example: v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          version="${tag#v}"
          name="racg_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"

          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -X github.com/itolstov/racg/internal/version.Version=${version}" \
            -o "dist/racg" ./cmd/racg

          tar -C dist -czf "dist/${name}.tar.gz" racg
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Resolve source revision
        id: rev
        shell: bash
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing material
        env:
          RACG_RELEASE_KEYSTORE_B64: ${{ secrets.RACG_RELEASE_KEYSTORE_B64 }}
          RACG_RELEASE_PROPERTIES: ${{ secrets.RACG_RELEASE_PROPERTIES }}
        run: |
          set -euo pipefail
          mkdir -p apps/android/docker
          if [[ -n "${RACG_RELEASE_KEYSTORE_B64}" && -n "${RACG_RELEASE_PROPERTIES}" ]]; then
            printf '%s' "${RACG_RELEASE_KEYSTORE_B64}" | base64 -d > apps/android/docker/release.keystore
            printf '%s\n' "${RACG_RELEASE_PROPERTIES}" > apps/android/docker/release.properties
            chmod 600 apps/android/docker/release.keystore apps/android/docker/release.properties
            echo "Release keystore: provided"
          else
            echo "::warning::RACG_RELEASE_KEYSTORE_B64 / RACG_RELEASE_PROPERTIES secrets are missing; the release APK will be unsigned"
          fi

      - name: Build APK (tests + debug + release)
        env:
          SOURCE_REVISION: ${{ steps.rev.outputs.revision }}
        run: bash apps/android/build-docker.sh apps/android/dist

      - name: Verify release signature
        run: bash apps/android/verify-release.sh apps/android/dist/racg-approver-release.apk

      - name: Upload android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            apps/android/dist/racg-approver-debug.apk
            apps/android/dist/racg-approver-release.apk
            apps/android/dist/SHA256SUMS
          if-no-files-found: error

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Collect android release files
        shell: bash
        run: |
          set -euo pipefail
          cp release/android-apk/racg-approver-release.apk release/
          cp release/android-apk/SHA256SUMS release/racg-approver-apk.sha256

      - name: Collect checksums
        shell: bash
        run: |
          set -euo pipefail
          find release -name '*.sha256' -type f -print0 | xargs -0 cat > release/checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release/**/*.tar.gz
            release/racg-approver-release.apk
            release/racg-approver-apk.sha256
            release/checksums.txt
